<style>
@font-face { font-family:Oswald; src:url(https://cdn.jsdelivr.net/npm/@fontsource-variable/oswald@5.1.1/files/oswald-latin-wght-normal.woff2) format("woff2-variations"); font-weight:200 700; font-display:block; }
@font-face { font-family:"SUIT Variable"; src:url(https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.woff2) format("woff2-variations"); font-weight:100 900; font-display:block; }
/* 색: 도시메트리 캘린더 기본 파랑 토큰. 테마 고르기는 없고 기기의 밝게/어둡게만 따른다 */
:root {
  --font-body:"SUIT Variable", "Apple SD Gothic Neo", sans-serif; --num:Oswald, "SUIT Variable", sans-serif;
  --bg:#eef5ff; --bg-top:#e3eeff; --card:#ffffff; --fg:#191919; --mute:#666666; --line:#dbe8ff;
  --acc:#2e70ff; --deep:#1428a0; --soft:#e8f1ff; --red:#fa4b50; --ok:#13865a; --ok-soft:#ddf3e8;
  --shadow:0 6px 22px rgba(46,112,255,.10); --card-border:transparent;
  --gut:max(16px, calc((100vw - 520px) / 2));
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f1420; --bg-top:#142039; --card:#1a2233; --fg:#e9eef8; --mute:#9ba8bf; --line:#2b3750;
    --acc:#508eff; --deep:#8cbaff; --soft:#1d2c4d; --red:#fb6f73; --ok:#4cc98a; --ok-soft:#15301f;
    --shadow:0 6px 22px rgba(0,0,0,.35); --card-border:#232e45;
    color-scheme:dark;
  }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:pan-x pan-y; }
html { overscroll-behavior-y:none; touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg-top); }
body { margin:0; min-height:100dvh; padding:calc(112px + env(safe-area-inset-top, 0px)) var(--gut) calc(84px + env(safe-area-inset-bottom, 0px));
  font:16px/1.5 var(--font-body); letter-spacing:-.01em; color:var(--fg); background:var(--bg);
  overscroll-behavior-y:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.sel { -webkit-user-select:text; user-select:text; }
button { font:inherit; color:inherit; cursor:pointer; }
a { color:inherit; }
[hidden] { display:none !important; }
svg { flex:none; }
.ar { font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
.num { font-family:var(--num); font-variant-numeric:tabular-nums; letter-spacing:.02em; }

/* 상단: 제목 + 날짜 */
.top { position:fixed; top:0; left:0; right:0; z-index:20; padding:calc(12px + env(safe-area-inset-top, 0px)) var(--gut) 10px; background:var(--bg-top); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:baseline; gap:8px; margin:0; height:28px; font-family:Oswald, sans-serif; font-size:20px; font-weight:700; letter-spacing:.1em; color:var(--deep); }
.brand small { font-family:var(--num); font-size:13px; font-weight:500; letter-spacing:.04em; color:var(--mute); }
.days { display:flex; gap:6px; margin-top:8px; }
.days button { flex:1; display:flex; flex-direction:column; align-items:center; padding:5px 0 6px; border:1px solid var(--line); border-radius:11px; background:var(--card); color:var(--mute); line-height:1.15; }
.days b { font-family:var(--num); font-size:18px; font-weight:600; color:var(--fg); }
.days span { font-size:12px; }
.days button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
.days button.on b { color:#fff; }
.top .sub { margin:8px 0 0; font-size:14px; font-weight:700; color:var(--fg); }
body.flat { padding-top:calc(60px + env(safe-area-inset-top, 0px)); }
body.flat .days, body.flat .top .sub { display:none; }

/* 하단 탭 */
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px); }
.tabbar div { display:grid; grid-template-columns:repeat(5, 1fr); width:100%; max-width:520px; }
.tabbar button { display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 8px; border:0; background:none; font-size:12px; font-weight:700; color:var(--mute); }
.tabbar svg { width:22px; height:22px; }
.tabbar button.on { color:var(--acc); }

/* 일정: 날짜 머리 + 카드 */
.dayhead { margin:14px 2px 10px; }
.dayhead h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.02em; color:var(--deep); }
.dayhead p { margin:2px 0 0; font-size:14px; color:var(--mute); }
.stop { display:block; width:100%; margin:0 0 12px; padding:0; overflow:hidden; text-align:left; border:1px solid var(--card-border); border-radius:16px; background:var(--card); box-shadow:var(--shadow); }
.stop .ph { position:relative; aspect-ratio:2.1; background:var(--soft); }
.stop .ph img { width:100%; height:100%; object-fit:cover; display:block; }
.stop .ph .strip { position:absolute; left:0; right:0; bottom:0; display:flex; gap:3px; padding:0 8px 8px; }
.stop .ph .strip img { width:44px; height:44px; border-radius:8px; border:2px solid #fff; object-fit:cover; }
.stop .bd { padding:11px 14px 13px; }
.stop .tt { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.stop .nm { font-size:18px; font-weight:800; line-height:1.3; }
.stop .tm { flex:none; font-family:var(--num); font-size:15px; font-weight:600; color:var(--acc); }
.stop .ds { margin:3px 0 0; font-size:14px; color:var(--mute); line-height:1.45; }
.stop.small { display:flex; align-items:center; gap:12px; padding:10px; }
.stop.small .th { flex:none; width:64px; height:64px; border-radius:12px; overflow:hidden; background:var(--soft); }
.stop.small .th img { width:100%; height:100%; object-fit:cover; display:block; }
.stop.small .bd { flex:1; min-width:0; padding:0; }
.stop.small .nm { font-size:16px; }
.badge { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:var(--soft); color:var(--acc); font-size:12px; font-weight:800; vertical-align:2px; white-space:nowrap; }
.badge.ok { background:var(--ok-soft); color:var(--ok); }
.badge.wait { background:transparent; border:1px dashed var(--line); color:var(--mute); }
.move { display:flex; align-items:center; gap:10px; margin:-2px 0 12px; padding:9px 12px; border:1px dashed var(--line); border-radius:12px; font-size:14px; color:var(--mute); }
.move svg { width:18px; height:18px; color:var(--acc); }
.move b { color:var(--fg); font-weight:700; }
.move .num { color:var(--acc); font-weight:600; margin-right:2px; }

/* 먹을 곳 */
.chips { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin:14px calc(var(--gut) * -1) 12px; padding:0 var(--gut); }
.chips::-webkit-scrollbar { display:none; }
.chips button { flex:none; padding:7px 13px; border:1px solid var(--line); border-radius:999px; background:var(--card); font-size:14px; font-weight:700; color:var(--mute); }
.chips button.on { background:var(--fg); border-color:var(--fg); color:var(--bg); }
.fgroup { margin:4px 2px 8px; font-size:16px; font-weight:800; color:var(--deep); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.fcard { display:block; padding:0; overflow:hidden; text-align:left; border:1px solid var(--card-border); border-radius:14px; background:var(--card); box-shadow:var(--shadow); }
.fcard .ph { aspect-ratio:1.25; background:var(--soft); }
.fcard .ph img { width:100%; height:100%; object-fit:cover; display:block; }
.fcard .bd { padding:8px 10px 10px; }
.fcard .nm { font-size:15px; font-weight:800; line-height:1.3; }
.fcard .ds { margin-top:2px; font-size:13px; color:var(--mute); line-height:1.35; }
.fcard .badge { margin:5px 0 0; }

/* 준비 · 정보 */
.sec { margin:18px 0 0; }
.sec h2 { margin:0 0 8px; font-size:18px; font-weight:800; color:var(--deep); }
.panel { padding:4px 14px; border:1px solid var(--card-border); border-radius:16px; background:var(--card); box-shadow:var(--shadow); }
.ck { display:flex; align-items:flex-start; gap:10px; width:100%; padding:10px 0; border:0; border-top:1px solid var(--line); background:none; text-align:left; font-size:15px; line-height:1.45; }
.ck:first-child { border-top:0; }
.ck i { flex:none; display:grid; place-items:center; width:20px; height:20px; margin-top:1px; border:2px solid var(--line); border-radius:6px; color:transparent; }
.ck i svg { width:14px; height:14px; }
.ck.on i { background:var(--ok); border-color:var(--ok); color:#fff; }
.ck.on span { color:var(--mute); text-decoration:line-through; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:8px 14px; margin:0; padding:10px 0; font-size:15px; }
.kv dt { color:var(--mute); }
.kv dd { margin:0; }
.row { padding:10px 0; border-top:1px solid var(--line); }
.row:first-child { border-top:0; }
.row b { display:block; font-size:16px; }
.row p { margin:2px 0 0; font-size:14px; color:var(--mute); line-height:1.5; }
.taxi { margin-top:10px; padding:16px 14px; border:2px solid var(--acc); border-radius:16px; background:var(--card); text-align:center; }
.taxi p { margin:0; font-size:13px; color:var(--mute); }
.taxi .big { margin:6px 0 10px; font-size:21px; font-weight:800; line-height:1.45; }
.say { margin-top:6px; padding:8px 12px; border-radius:10px; background:var(--bg); font-size:15px; }
.say small { display:block; color:var(--mute); font-size:13px; }

/* 시트 */
body.modal-open { overflow:hidden; }
.scrim { position:fixed; inset:0; z-index:40; background:rgba(5,10,25,.5); }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:560px; margin:0 auto; max-height:calc(100dvh - 30px - env(safe-area-inset-top, 0px)); overflow-y:auto; border-radius:20px 20px 0 0; background:var(--card); padding:0 0 calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet .hero { position:relative; aspect-ratio:1.9; background:var(--soft); }
.sheet .hero img { width:100%; height:100%; object-fit:cover; display:block; }
.sheet .close { position:absolute; top:10px; right:10px; display:grid; place-items:center; width:36px; height:36px; padding:0; border:0; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; }
.sheet .close svg { width:18px; height:18px; }
.sheet .nohero { height:52px; }
.sheet .nohero .close { background:var(--soft); color:var(--acc); }
.sb { padding:14px 16px 0; }
.sb h2 { margin:0; font-size:22px; font-weight:800; line-height:1.3; }
.sb .meta { margin:4px 0 0; font-size:14px; color:var(--mute); }
.sb h3 { margin:20px 0 8px; font-size:15px; font-weight:800; color:var(--deep); }
.steps { margin:0; padding:0; list-style:none; }
.steps li { display:flex; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:15px; line-height:1.45; }
.steps li:first-child { border-top:0; }
.steps .t { flex:none; width:56px; font-family:var(--num); font-weight:600; color:var(--acc); }
.steps .t.w { font-family:var(--font-body); font-size:14px; font-weight:700; }
.steps p { margin:1px 0 0; font-size:13.5px; color:var(--mute); }
.notes { margin:0; padding-left:18px; font-size:15px; line-height:1.55; }
.notes li + li { margin-top:3px; }
.pl { display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
.pl:first-child { border-top:0; }
.pl .th { flex:none; width:76px; height:76px; border-radius:12px; overflow:hidden; background:var(--soft); }
.pl .th img { width:100%; height:100%; object-fit:cover; display:block; }
.pl .in { flex:1; min-width:0; }
.pl .nm { font-size:16px; font-weight:800; line-height:1.3; }
.pl .jp { font-size:13px; color:var(--mute); }
.pl .ds { margin-top:3px; font-size:14px; line-height:1.45; }
.pl details { margin-top:6px; }
.pl summary { display:inline-flex; align-items:center; gap:3px; list-style:none; font-size:13.5px; font-weight:700; color:var(--acc); cursor:pointer; }
.pl summary::-webkit-details-marker { display:none; }
.pl summary svg { width:14px; height:14px; transition:transform .15s; }
.pl details[open] summary svg { transform:rotate(90deg); }
.hours { margin-top:6px; display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:13.5px; }
.hours .d { font-weight:700; }
.hours .d.sun, .hours .off { color:var(--red); }
.hours .t { color:var(--mute); font-variant-numeric:tabular-nums; }
.hours .today { color:var(--acc); }
.addr { margin-top:6px; padding:7px 10px; border-radius:9px; background:var(--bg); font-size:13.5px; line-height:1.45; overflow-wrap:anywhere; }
.btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.btns a { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); font-size:13.5px; font-weight:700; color:var(--acc); text-decoration:none; }
.btns a svg { width:15px; height:15px; }
/* 관광지 */
.lead { margin:14px 2px 10px; font-size:14px; color:var(--mute); }
.sight { display:flex; gap:12px; width:100%; margin:0 0 10px; padding:10px; text-align:left; border:1px solid var(--card-border); border-radius:16px; background:var(--card); box-shadow:var(--shadow); }
.sight .th { flex:none; width:92px; height:92px; border-radius:12px; overflow:hidden; background:var(--soft); }
.sight .th img { width:100%; height:100%; object-fit:cover; display:block; }
.sight .in { flex:1; min-width:0; }
.sight .nm { font-size:17px; font-weight:800; line-height:1.3; }
.sight .ds { margin-top:2px; font-size:13.5px; color:var(--mute); line-height:1.4; }
.go { display:inline-flex; align-items:center; gap:4px; margin-top:6px; padding:2px 9px 2px 7px; border-radius:999px; background:var(--soft); color:var(--acc); font-size:13px; font-weight:800; }
.go svg { width:15px; height:15px; }
.when { margin-top:4px; font-size:13px; font-weight:700; color:var(--ok); }
.route { margin:8px 0 0; padding:10px 12px; border-radius:12px; background:var(--soft); font-size:15px; line-height:1.5; }
.route b { color:var(--acc); }

/* 지출 */
.money { margin-top:14px; padding:16px; border-radius:18px; background:var(--card); box-shadow:var(--shadow); border:1px solid var(--card-border); }
.money .lbl { font-size:14px; color:var(--mute); }
.money .big { font-family:var(--num); font-size:34px; font-weight:600; line-height:1.2; color:var(--deep); }
.money .big.minus { color:var(--red); }
.money .big small { font-family:var(--font-body); font-size:17px; font-weight:700; margin-left:2px; }
.bar { height:8px; margin:10px 0 12px; border-radius:99px; background:var(--soft); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--acc); border-radius:99px; }
.cash { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.cash div { padding:9px 11px; border-radius:12px; background:var(--bg); }
.cash span { display:block; font-size:12.5px; color:var(--mute); }
.cash b { font-family:var(--num); font-size:19px; font-weight:600; }
.form { margin-top:12px; padding:14px; border-radius:18px; background:var(--card); box-shadow:var(--shadow); border:1px solid var(--card-border); }
.form h2 { margin:0 0 10px; font-size:17px; font-weight:800; color:var(--deep); }
.form input { width:100%; padding:11px 12px; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); -webkit-user-select:text; user-select:text; }
.amt { display:flex; gap:8px; }
.amt input { flex:1; min-width:0; font-family:var(--num); font-size:20px; font-weight:600; }
.seg { display:flex; gap:4px; padding:3px; border-radius:11px; background:var(--soft); }
.seg button { flex:1; padding:8px 6px; border:0; border-radius:8px; background:none; font-size:15px; font-weight:700; color:var(--mute); white-space:nowrap; }
.seg button.on { background:var(--card); color:var(--acc); box-shadow:0 1px 4px rgba(46,112,255,.15); }
.form .lab { margin:12px 0 6px; font-size:13.5px; font-weight:700; color:var(--mute); }
.add { width:100%; margin-top:14px; padding:13px; border:0; border-radius:12px; background:var(--acc); color:#fff; font-size:16px; font-weight:800; }
.add:disabled { opacity:.45; }
.people { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.people > div { padding:10px; border-radius:14px; background:var(--card); box-shadow:var(--shadow); border:1px solid var(--card-border); text-align:center; }
.people b { display:block; font-size:15px; }
.people .v { font-family:var(--num); font-size:17px; font-weight:600; }
.people .v.minus { color:var(--red); }
.people .v.plus { color:var(--ok); }
.people span { display:block; font-size:12px; color:var(--mute); }
.elist .dh { margin:16px 2px 6px; font-size:15px; font-weight:800; color:var(--deep); display:flex; justify-content:space-between; }
.elist .dh span { font-family:var(--num); font-weight:600; color:var(--mute); }
.erow { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.erow:first-child { border-top:0; }
.erow .w { flex:1; min-width:0; }
.erow .w b { display:block; font-size:15px; font-weight:700; overflow-wrap:anywhere; }
.erow .w span { font-size:12.5px; color:var(--mute); }
.erow .a { font-family:var(--num); font-size:17px; font-weight:600; white-space:nowrap; text-align:right; }
.erow .a small { display:block; font-family:var(--font-body); font-size:12px; font-weight:500; color:var(--mute); }
.erow .del { flex:none; display:grid; place-items:center; width:30px; height:30px; padding:0; border:0; border-radius:50%; background:var(--bg); color:var(--mute); }
.erow .del svg { width:14px; height:14px; }
.empty { padding:22px 0; text-align:center; font-size:14px; color:var(--mute); }
.copy { display:block; margin:14px auto 0; padding:9px 16px; border:1px solid var(--line); border-radius:999px; background:var(--card); font-size:14px; font-weight:700; color:var(--acc); }
.upd { position:fixed; left:var(--gut); right:var(--gut); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); z-index:45; padding:13px; font-size:15px; font-weight:800; border:0; border-radius:12px; background:var(--acc); color:#fff; box-shadow:0 6px 20px rgba(46,112,255,.35); }
#toast { position:fixed; left:var(--gut); right:var(--gut); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); z-index:50; padding:12px; border-radius:12px; background:var(--deep); color:#fff; font-weight:700; text-align:center; opacity:0; transition:opacity .2s; pointer-events:none; }
@media (prefers-color-scheme: dark) { #toast { background:#2e70ff; } }
#toast.show { opacity:.97; }
.foot { margin:24px 0 0; text-align:center; font-size:12px; color:var(--mute); }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">SAPPORO<small>2026.11.21 - 11.25</small></h1>
  <nav class="days" id="days" aria-label="날짜"></nav>

  <div class="form"><h2>지출 적기</h2>

    <input id="what" type="text" placeholder="무엇에 (예: KING 저녁)" autocomplete="off" style="margin-top:8px">
    <div class="lab">누가 냈나</div>${seg('who', WHO.map(w => [w, w]))}
    <div class="lab">날짜</div>${seg('day', DAYS.map(D => [D.d, D.d + '일']))}
    <button type="button" class="add" id="addSpend">지출 추가</button>
  </div>
  <section class="sec"><h2>사람별</h2>
    <div class="people">${ppl.map(([p, paid, net]) => `<div><b>${p}</b><span>대신 낸 돈 ${fmt(paid)}원</span><div class="v ${net > 0 ? 'plus' : net < 0 ? 'minus' : ''}">${net > 0 ? '+' : net < 0 ? '-' : ''}${fmt(Math.abs(net))}</div><span>${net > 0 ? '돌려받을 돈' : net < 0 ? '더 낼 돈' : '정산할 것 없음'}</span></div>`).join('')}</div>
    <p class="lead" style="margin-top:8px">${over ? `공금을 ${fmt(over)}원 넘어서 한 사람당 ${fmt(share)}원씩 더 냅니다.` : '공금 안에서 쓰는 중. 넘으면 넘친 돈을 3명이 똑같이 나눕니다.'} 엔화는 1엔 ${RATE}원으로 계산.</p>
  </section>
  <section class="sec elist"><h2>쓴 돈 <span class="num" style="font-size:15px;color:var(--mute)">${fmt(PRE + trip)}원</span></h2>${spend.length ? `<p class="lead" style="margin:-4px 2px 0">여행 중 ${mix(spend)}, 엔화는 원으로 바꿔 합계에 넣음</p>` : ''}
    <div class="dh">출발 전<span>${fmt(PRE)}원</span></div><div class="panel">${PRE_LIST.map(([w, a]) => `<div class="erow"><div class="w"><b>${esc(w)}</b><span>공금</span></div><div class="a">${fmt(a)}원</div></div>`).join('')}</div>
    ${byDay.length ? byDay.map(([d, l]) => `<div class="dh">11월 ${d}일<span>${mix(l)}</span></div><div class="panel">${l.map(e => `<div class="erow"><div class="w"><b>${esc(e.what || '지출')}</b><span>${e.who === '공금' ? (e.cur === '¥' ? '공금 엔화' : '공금 원화') : esc(e.who) + '가 냄'}</span></div><div class="a">${e.cur === '¥' ? '¥' + fmt(e.amt) + `<small>${fmt(won(e))}원</small>` : fmt(e.amt) + '원'}</div><button type="button" class="del" data-del="${e.id}" aria-label="이 지출 지우기">${IC.x}</button></div>`).join('')}</div>`).join('')
      : '<div class="dh">여행 중</div><div class="panel"><div class="empty">여행 중 지출은 위에서 금액을 넣고 지출 추가를 누르세요</div></div>'}
    ${spend.length ? '<button type="button" class="copy" id="copySpend">경비 노트에 붙일 글 복사</button>' : ''}
  </section>
  <p class="lead">환전은 지출이 아니라 원화를 엔화로 바꾼 것이라 넣지 않았습니다. 여행 중 기록은 이 폰에만 저장됩니다.</p>`;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800); }
function saveSpend() { try { localStorage.setItem('sp_spend', JSON.stringify(spend)); } catch (e) {} }

function drawPrep() {
  const ck = (h, li) => `<section class="sec"><h2>${esc(h)}</h2><div class="panel">${li.map(x => { const k = h + '/' + x; return `<button type="button" class="ck${done[k] ? ' on' : ''}" data-ck="${esc(k)}"><i>${IC.check}</i><span>${T(x)}</span></button>`; }).join('')}</div></section>`;
  return PREP.map(g => ck(g.h, g.li)).join('') + `
  <section class="sec"><h2>아빠 쇼핑</h2><div class="panel">
    <div class="row"><b>피노 헤어마스크</b><p>드러그스토어, 돈키호테. 본품 230g, 리필 700g</p><div class="say"><span class="sel">フィーノのヘアマスクはありますか？</span><small>피노 헤어마스크 있나요?</small></div></div>
    <div class="row"><b>담배</b><p>11/25 공항 국제선 3층 면세점. 한국 면세 1인 1보루</p><div class="say"><span class="sel">この銘柄はありますか？</span><small>사진을 보여 주며, 이 제품 있나요?</small></div></div>
    <div class="row"><b>고모 선물 법랑 주전자</b><p>다이마루 7층, 다음 핸즈 8층. 후지호로, Plune. 인덕션 되는지 확인</p></div>
  </div></section>
  <section class="sec"><h2>면세</h2><div class="panel">
    <div class="row"><b>살 때</b><p>각자 여권과 각자 명의 카드. 영수증 보관</p></div>
    <div class="row"><b>11/25 공항</b><p>면세품 반출 확인 → 캐리어 맡기기 → 보안검사. 짐을 먼저 부치지 않기</p></div>
    <div class="row"><b>한국 들어올 때</b><p>1인 미화 800달러까지, 담배는 따로 1보루</p></div>
  </div></section>`;
}
function drawInfo() {
  const h = G.hotel || {};
  return `
  <section class="sec"><h2>숙소</h2><div class="panel"><dl class="kv">
    <dt>이름</dt><dd>삿포로 호텔 바이 그란벨</dd>
    <dt>날짜</dt><dd>11/21 15:00 체크인<br>11/25 11:00 체크아웃 (4박)</dd>
    <dt>방</dt><dd>퀸 침대 + 데이베드</dd>
    <dt>위치</dt><dd>JR 삿포로역 북쪽 출구에서 걸어서 7분</dd>
    <dt>시설</dt><dd>25층 대욕장, 26층 헬스장 13:00~23:00, 1층 패밀리마트</dd>
    <dt>조식</dt><dd>1층 06:30~10:00, 1인 4,000엔. 당일 프런트에서</dd>
  </dl></div>
  <div class="taxi"><p>택시에서 이 화면을 보여 주세요</p><div class="big sel">札幌ホテル by グランベル<br>札幌市東区北6条東2丁目2-2</div>
    <div class="btns" style="justify-content:center">${h.map ? `<a href="${h.map}" target="_blank" rel="noopener">${IC.pin}지도</a>` : ''}<a href="tel:0112140914">${IC.tel}011-214-0914</a></div></div>
  </section>
  <section class="sec"><h2>항공</h2><div class="panel">
    <div class="row"><b>가는 편 11/21 토</b><p>파라타항공 WE531. 10:05 인천 1터미널 → 12:45 신치토세. 맡기는 짐 1인 15kg</p></div>
    <div class="row"><b>오는 편 11/25 수</b><p>트리니티항공 TW264. 14:40 신치토세 → 18:10 인천 1터미널. 맡기는 짐 1인 1개</p></div>
  </div></section>
  <section class="sec"><h2>투어 집합</h2><div class="panel">
    <div class="row"><b>11/22 비에이 07:10</b><p>삿포로역 북광장 공중화장실 앞, 분홍 깃발</p></div>
    <div class="row"><b>11/24 노보리베츠 08:30</b><p>삿포로역 북광장 퍼블릭 화장실 앞, 와쿠와쿠 깃발. 예약자 이름이나 휴대전화 끝 4자리</p></div>
  </div></section>
  <section class="sec"><h2>교통</h2><div class="panel">
    <div class="row"><b>교통카드</b><p>JR과 지하철 모두 Suica, Kitaca로 찍고 탑니다</p></div>
    <div class="row"><b>공항 → 삿포로</b><p>쾌속 에어포트 약 40분. さっぽろ에서 내리기</p></div>
    <div class="row"><b>삿포로 → 미나미오타루</b><p>JR 쾌속 30~50분, 편도 800엔</p></div>
    <div class="row"><b>삿포로역 → 스스키노</b><p>지하철 남북선 2정거장. 오도리는 1정거장</p></div>
  </div></section>`;
}
const TABS = [['day', '일정', 'cal'], ['sight', '관광지', 'mount'], ['food', '먹을 곳', 'food'], ['spend', '지출', 'won'], ['info', '정보', 'info']];
function render() {
  $('#tabs').innerHTML = TABS.map(([k, l, i]) => `<button type="button" data-tab="${k}" class="${k === tab ? 'on' : ''}">${IC[i]}${l}</button>`).join('');
  $('#days').innerHTML = DAYS.map((D, i) => `<button type="button" data-day="${i}" class="${i === day ? 'on' : ''}" aria-label="11월 ${D.d}일"><b>${D.d}</b><span>${D.w}</span></button>`).join('');
  document.body.classList.toggle('flat', tab !== 'day');
  $('#main').innerHTML = ar({ day: drawDay, sight: drawSights, food: drawFood, spend: drawSpend, info: () => drawInfo() + drawPrep() }[tab]());
}

/* ── 시트 ── */
function openSheet(html, hero) {
  $('#sheet').innerHTML = (hero ? `<div class="hero">${img(hero)}<button type="button" class="close" data-close aria-label="닫기">${IC.x}</button></div>`
    : `<div class="hero nohero"><button type="button" class="close" data-close aria-label="닫기">${IC.x}</button></div>`) + `<div class="sb">${ar(html)}</div>`;
  $('#sheet').hidden = $('#scrim').hidden = false; $('#sheet').scrollTop = 0;
  document.body.classList.add('modal-open'); syncHistory();
}
function closeSheet() { $('#sheet').hidden = $('#scrim').hidden = true; document.body.classList.remove('modal-open'); syncHistory(); }
function openStop(id) {
  const it = DAYS.flatMap(D => D.items.map(x => ({ ...x, D }))).find(x => x.id === id);
  const steps = it.steps ? `<h3>시간표</h3><ul class="steps">${it.steps.map(([t, w, p]) => `<li><div class="t${/\d/.test(t) ? '' : ' w'}">${esc(t)}</div><div>${T(w)}${p ? `<p>${T(p)}</p>` : ''}</div></li>`).join('')}</ul>` : '';
  const notes = it.notes ? `<h3>알아 둘 것</h3><ul class="notes">${it.notes.map(n => `<li>${T(n)}</li>`).join('')}</ul>` : '';
  openSheet(`<h2>${T(it.name)}${badge(it.badge)}</h2><p class="meta">11월 ${it.D.d}일 ${it.D.w}요일 <span class="num">${esc(it.time)}</span></p><p class="meta">${T(it.ds)}</p>${steps}${notes}<h3>${it.places.length > 1 ? '장소' : '가게 정보'}</h3>${it.places.map(placeRow).join('')}`, it.photo);
}

document.addEventListener('click', e => {
  const t = e.target;
  let b;
  if ((b = t.closest('[data-tab]'))) { tab = b.dataset.tab; render(); scrollTo(0, 0); syncHistory(); }
  else if ((b = t.closest('[data-day]'))) { day = +b.dataset.day; render(); scrollTo(0, 0); }
  else if ((b = t.closest('[data-food]'))) { food = b.dataset.food; render(); }
  else if ((b = t.closest('[data-stop]'))) openStop(b.dataset.stop);
  else if ((b = t.closest('[data-place]'))) openSheet(placeRow(b.dataset.place), b.dataset.place);
  else if ((b = t.closest('[data-sight]'))) openSight(b.dataset.sight);
  else if ((b = t.closest('[data-f]'))) { const a = $('#amt').value, w = $('#what').value; form[b.dataset.f] = b.dataset.f === 'day' ? +b.dataset.v : b.dataset.v; render(); $('#amt').value = a; $('#what').value = w; }
  else if (t.closest('#addSpend')) {
    const amt = Math.round(parseFloat(($('#amt').value || '').replace(/[^\d.]/g, '')) || 0);
    if (!amt) { toast('금액을 숫자로 넣어 주세요'); $('#amt').focus(); return; }
    spend.push({ id: Date.now(), day: form.day, what: $('#what').value.trim(), amt, cur: form.cur, who: form.who });
    saveSpend(); render(); toast('지출을 추가했어요');
  }
  else if ((b = t.closest('[data-del]'))) {
    const e2 = spend.find(x => x.id === +b.dataset.del);
    if (e2 && confirm(`「${e2.what || '지출'}」 ${e2.cur === '¥' ? '¥' + fmt(e2.amt) : fmt(e2.amt) + '원'}을 지울까요?`)) { spend = spend.filter(x => x !== e2); saveSpend(); render(); toast('지출을 지웠어요'); }
  }
  else if (t.closest('#copySpend')) {
    const txt = spend.map(e => `- 11/${e.day} ${e.cur === '¥' ? '¥' + fmt(e.amt) : fmt(e.amt) + '원'}, ${e.what || '지출'}${e.who === '공금' ? (e.cur === '¥' ? ' - 현금' : '') : ' - ' + e.who + ' 냄'}`).join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('복사했어요. 경비 노트 메모에 붙여 넣으세요'), () => toast('복사하지 못했어요. 길게 눌러 직접 복사하세요'));
  }
  else if ((b = t.closest('[data-ck]'))) { const k = b.dataset.ck; done[k] = !done[k]; try { localStorage.setItem('sp_done', JSON.stringify(done)); } catch (e) {} b.classList.toggle('on', !!done[k]); }
  else if (t.closest('[data-close]') || t === $('#scrim')) closeSheet();
});
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ── 갤럭시 뒤로 가기: 시트가 열렸거나 일정 탭이 아니면 기록 한 칸을 잡아 두고, 뒤로 = 닫기·일정으로 ── */
let ignorePop = false;
function syncHistory() {
  const inner = tab !== 'day' || !$('#sheet').hidden, st = history.state && history.state.inner;
  if (inner && !st) history.pushState({ inner: 1 }, '');
  else if (!inner && st) { ignorePop = true; history.back(); }
}
addEventListener('popstate', () => {
  if (ignorePop) { ignorePop = false; return; }
  if (!$('#sheet').hidden) closeSheet();
  else if (tab !== 'day') { tab = 'day'; render(); scrollTo(0, 0); }
  syncHistory();
});
render();

/* ── 설치·업데이트: version.json 이 처음 본 버전과 다르면 새로고침 버튼 ── */
{
  const KEY = 'sp-seen-version', btn = $('#upd');
  let latest = null;
  const check = () => fetch('./version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.version) return;
    let seen = null; try { seen = localStorage.getItem(KEY); } catch (e) {}
    if (!seen) { try { localStorage.setItem(KEY, j.version); } catch (e) {} return; }
    latest = j.version !== seen ? j.version : null; btn.hidden = !latest;
  }).catch(() => {});
  btn.onclick = () => {
    btn.hidden = true; try { if (latest) localStorage.setItem(KEY, latest); } catch (e) {}
    const clear = window.caches ? caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))) : Promise.resolve();
    const upd = 'serviceWorker' in navigator ? navigator.serviceWorker.getRegistration().then(r => r && r.update()) : Promise.resolve();
    Promise.all([clear.catch(() => {}), upd.catch(() => {})]).then(() => location.replace('./index.html?v=' + encodeURIComponent(latest || Date.now())));
  };
  addEventListener('load', () => { if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {}); check(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
}
</script>
</body>
</html>
